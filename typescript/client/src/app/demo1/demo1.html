<form onsubmit="return false;">
    <div class="container">
        <!-- First 3x3 Matrix -->
        <div class="matrix input_matrix">
            <input type="number" name="matrix1_00" value="1">
            <input type="number" name="matrix1_01" value="2">
            <input type="number" name="matrix1_02" value="3">
            <input type="number" name="matrix1_10" value="4">

            <input type="number" name="matrix1_21" value="8">

        <!-- Second 3x3 Matrix -->
        <div class="matrix input_matrix">
            <input type="number" name="matrix2_00" value="9">
