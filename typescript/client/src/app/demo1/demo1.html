<h2>Matrix Multiplication Demo (client side)</h2>
<br />

<form onsubmit="return false;">
    <div class="container">
        <div>
            <h3>Matrix A</h3>
            <div class="matrix input_matrix">
                <input type="number" name="matrix1_00" value="1" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_01" value="2" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_02" value="3" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_10" value="4" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_11" value="5" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_12" value="6" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_20" value="7" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_21" value="8" (keyup)="computeMatrix()">
                <input type="number" name="matrix1_22" value="9" (keyup)="computeMatrix()">
            </div>
        </div>

        <div><h3 class="multiply-symbol">X</h3></div>

        <!-- Second 3x3 Matrix -->
        <div>
            <h3>Matrix B</h3>
            <div class="matrix input_matrix">
                <input type="number" name="matrix2_00" value="9" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_01" value="8" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_02" value="7" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_10" value="6" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_11" value="5" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_12" value="4" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_20" value="3" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_21" value="2" (keyup)="computeMatrix()">
                <input type="number" name="matrix2_22" value="1" (keyup)="computeMatrix()">
            </div>
        </div>
    </div>
</form>

<!-- Result 3x3 Matrix -->
<div class="result_container">
    <br />
    <h3>Result Matrix:</h3>
    <div class="container">
        <div class="matrix result_matrix">
            <input type="number" name="matrix3_00" value="" readonly>
            <input type="number" name="matrix3_01" value="" readonly>
            <input type="number" name="matrix3_02" value="" readonly>
            <input type="number" name="matrix3_10" value="" readonly>
            <input type="number" name="matrix3_11" value="" readonly>
            <input type="number" name="matrix3_12" value="" readonly>
            <input type="number" name="matrix3_20" value="" readonly>
            <input type="number" name="matrix3_21" value="" readonly>
            <input type="number" name="matrix3_22" value="" readonly>
        </div>
    </div>
</div>
